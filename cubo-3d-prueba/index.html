<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba 3D — cubo mínimo</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: system-ui, sans-serif; }
  h1 { position: fixed; top: 12px; left: 0; right: 0; margin: 0; text-align: center; font-size: 20px; font-weight: 600; z-index: 2; pointer-events: none; }
  #estado { position: fixed; bottom: 12px; left: 0; right: 0; margin: 0; text-align: center; font-size: 14px; color: #ccc; z-index: 2; pointer-events: none; }
  #estado.error { color: #ff8080; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<h1>Prueba 3D — cubo mínimo</h1>
<p id="estado">Cargando Three.js…</p>
<script type="module">
  const estado = document.getElementById('estado');
  const setEstado = (msg, esError) => {
    estado.textContent = msg;
    estado.classList.toggle('error', !!esError);
  };

  // Si el CDN no carga, el import de "three" falla y cae en este catch.
  window.addEventListener('error', (e) => {
    if (estado.textContent === 'Cargando Three.js…') {
      setEstado('No se pudo cargar Three.js desde el CDN. Revisa la conexión.', true);
    }
  }, true);

  try {
    const THREE = await import('three');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true });
    } catch (e) {
      setEstado('WebGL no está disponible en este navegador.', true);
      throw e;
    }
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 5;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const luz = new THREE.DirectionalLight(0xffffff, 1.2);
    luz.position.set(3, 4, 5);
    scene.add(luz);

    const cubo = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.5, 1.5),
      new THREE.MeshStandardMaterial({ color: 0x2f7de1 })
    );
    scene.add(cubo);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    setEstado('cubo girando');
    renderer.setAnimationLoop(() => {
      cubo.rotation.x += 0.01;
      cubo.rotation.y += 0.015;
      renderer.render(scene, camera);
    });
  } catch (e) {
    console.error(e);
    if (!estado.classList.contains('error')) {
      setEstado('No se pudo iniciar WebGL / Three.js. Revisa la conexión o el soporte WebGL.', true);
    }
  }
</script>
</body>
</html>
